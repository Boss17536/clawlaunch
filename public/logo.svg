<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clawGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rocket/Launch Shape -->
  <path d="M100 20 L130 160 L100 140 L70 160 Z" fill="url(#clawGradient)" filter="url(#glow)" />
  <!-- Claw Prongs -->
  <path d="M80 60 Q60 80 70 110" stroke="#4ade80" stroke-width="8" fill="none" stroke-linecap="round" />
  <path d="M120 60 Q140 80 130 110" stroke="#c084fc" stroke-width="8" fill="none" stroke-linecap="round" />
  <path d="M100 50 Q100 30 100 80" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8" />
  <!-- Launch Flames -->
  <path d="M90 150 Q100 180 110 150" fill="#4ade80" opacity="0.6" />
</svg>
